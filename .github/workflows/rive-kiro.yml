name: Rive Kiro

on:
  push:
    branches:
      - feat/rive-native-character
    paths:
      - 'rive/kiro/**'
      - 'public/rive/**'
      - 'src/**'
      - 'scripts/capture-rive-kiro.mjs'
      - 'package.json'
      - '.github/workflows/rive-kiro.yml'
  workflow_dispatch:

jobs:
  verify-build-render:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package.json

      - name: Install app dependencies
        run: npm install --no-audit --no-fund

      - name: Install Rive Linux dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgles2 libx11-6 libgl1

      - name: Install Rive CLI
        shell: bash
        run: |
          curl -fsSL https://releases.rive.app/cli/install.sh | bash
          echo "$HOME/.rive/bin" >> "$GITHUB_PATH"

      - name: Show CLI version
        run: rive --version

      - name: Prepare output directory
        run: mkdir -p rive/kiro/build visual-artifacts public/rive

      - name: Verify RML
        shell: bash
        run: |
          set -o pipefail
          rive rive/kiro --verify --format=json | tee rive/kiro/build/verify.json

      - name: Build unsigned runtime asset
        shell: bash
        run: |
          set -o pipefail
          rive rive/kiro --once --format=json | tee rive/kiro/build/build.json

      - name: Inspect resolved scene
        run: rive inspect rive/kiro --json > rive/kiro/build/inspect.json

      - name: Use the freshly built Rive asset in the app
        run: cp rive/kiro/build/kiro.riv public/rive/kiro.riv

      - name: Typecheck and build app
        run: npm run build

      - name: Install Playwright Chromium
        run: |
          npm install --no-save --no-audit --no-fund playwright@latest
          npx playwright install --with-deps chromium

      - name: Start app preview
        shell: bash
        run: |
          npx vite preview --host 127.0.0.1 --port 4173 > /tmp/pixilive-rive-preview.log 2>&1 &
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4173 > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/pixilive-rive-preview.log || true
          exit 1

      - name: Capture Kiro browser states
        env:
          PIXILIVE_PREVIEW_URL: http://127.0.0.1:4173
        run: node scripts/capture-rive-kiro.mjs

      - name: Render two-second CLI preview
        run: rive rive/kiro --screenshot=rive/kiro/build/kiro-cli.png --advance=2s

      - name: Capture schemas for the next rig iteration
        shell: bash
        run: |
          {
            for TYPE in Artboard LayoutComponentStyle Shape Triangle Ellipse Rectangle Fill SolidColor Node RootBone Bone IKConstraint TranslationConstraint RotationConstraint TransformConstraint ViewModel ViewModelPropertyNumber ViewModelPropertyBoolean ViewModelPropertyEnum ViewModelPropertyTrigger Enum; do
              echo "=== $TYPE ==="
              rive schema "$TYPE" || true
              echo
            done
            echo '=== Drawing docs search ==='
            rive docs --search 'SolidColor' || true
            echo
            echo '=== Data binding docs search ==='
            rive docs --search 'ViewModelPropertyNumber' || true
            echo
            rive docs --search 'viewModelId' || true
            echo
            echo '=== Joystick docs search ==='
            rive docs --search 'joystick' || true
          } > rive/kiro/build/schema-notes.txt

      - name: Capture CLI authoring docs and scaffold
        shell: bash
        run: |
          rive docs skeleton > rive/kiro/build/docs-skeleton.txt
          rive docs drawing > rive/kiro/build/docs-drawing.txt
          rive docs data > rive/kiro/build/docs-data.txt
          rive docs rigging > rive/kiro/build/docs-rigging.txt
          rm -rf /tmp/kiro-scaffold
          rive create /tmp/kiro-scaffold
          cp /tmp/kiro-scaffold/scene.rml rive/kiro/build/scaffold-scene.rml
          cp /tmp/kiro-scaffold/rive.yaml rive/kiro/build/scaffold-rive.yaml
          rive /tmp/kiro-scaffold --screenshot=rive/kiro/build/scaffold.png

      - name: Render official triangle probe
        shell: bash
        run: |
          rm -rf /tmp/rive-probe
          mkdir -p /tmp/rive-probe
          cat > /tmp/rive-probe/rive.yaml <<'EOF'
          name: probe
          EOF
          cat > /tmp/rive-probe/scene.rml <<'EOF'
          <Rive version="1" kind="fragment">
              <Artboard defaultStateMachineId="0:7" styleId="0:5" width="500" height="500" name="Artboard" id="0:2">
                  <LayoutComponentStyle name="Artboard Style" id="0:5"/>
                  <Fill name="Background"><SolidColor colorValue="FF1D1D1D" name="Color"/></Fill>
                  <Shape x="250" y="250" name="Triangle" id="0:14">
                      <Triangle originX="0.5" originY="0.5" width="220" height="200" name="Path"/>
                      <Fill name="Fill"><SolidColor colorValue="FF57A5E0" name="Color"/></Fill>
                  </Shape>
                  <StateMachine name="State Machine 1" id="0:7">
                      <StateMachineLayer name="Layer 1" id="0:8">
                          <AnyState x="200" y="-120"/>
                          <ExitState x="400" y="-120"/>
                          <EntryState><StateTransition stateToId="0:12"/></EntryState>
                          <AnimationState x="200" animationId="0:6" id="0:12"/>
                      </StateMachineLayer>
                  </StateMachine>
                  <LinearAnimation loopValue="loop" duration="120" name="Spin" id="0:6">
                      <KeyedObject objectId="0:14">
                          <KeyedProperty propertyKey="15">
                              <KeyFrameDouble value="0" interpolationType="linear"/>
                              <KeyFrameDouble value="6.2831855" interpolationType="linear" frame="120"/>
                          </KeyedProperty>
                      </KeyedObject>
                  </LinearAnimation>
              </Artboard>
          </Rive>
          EOF
          rive /tmp/rive-probe --verify --format=json > rive/kiro/build/probe-verify.json
          rive /tmp/rive-probe --screenshot=rive/kiro/build/probe.png --advance=1s

      - name: Upload Rive artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kiro-rive-build
          path: |
            rive/kiro/build/
            visual-artifacts/kiro-*.png
          if-no-files-found: warn
