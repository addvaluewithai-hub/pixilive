name: Rive Character Library

on:
  push:
    branches:
      - feat/rive-native-character
    paths:
      - 'rive/**'
      - 'src/**'
      - 'scripts/generate-rive-mascots.mjs'
      - 'scripts/generate-foxy-v2.mjs'
      - 'scripts/fix-foxy-v2-ids.mjs'
      - 'scripts/capture-rive-kiro.mjs'
      - 'scripts/capture-foxy-quality.mjs'
      - 'package.json'
      - '.github/workflows/rive-kiro.yml'
  workflow_dispatch:

jobs:
  verify-build-render:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package.json

      - name: Install app dependencies
        run: npm install --no-audit --no-fund

      - name: Generate code-first mascot RML
        run: |
          node scripts/generate-rive-mascots.mjs
          node scripts/generate-foxy-v2.mjs
          node scripts/fix-foxy-v2-ids.mjs

      - name: Install Rive Linux dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgles2 libx11-6 libgl1

      - name: Install Rive CLI
        shell: bash
        run: |
          curl -fsSL https://releases.rive.app/cli/install.sh | bash
          echo "$HOME/.rive/bin" >> "$GITHUB_PATH"

      - name: Show CLI version
        run: rive --version

      - name: Prepare output directories
        shell: bash
        run: |
          mkdir -p public/rive visual-artifacts/foxy-v2
          for CHARACTER in benny dino foxy kiro; do
            mkdir -p "rive/$CHARACTER/build"
          done

      - name: Verify all RML projects
        shell: bash
        run: |
          set -euo pipefail
          for CHARACTER in benny dino foxy kiro; do
            echo "=== verify $CHARACTER ==="
            rive "rive/$CHARACTER" --verify --format=json | tee "rive/$CHARACTER/build/verify.json"
          done

      - name: Build all runtime assets
        shell: bash
        run: |
          set -euo pipefail
          for CHARACTER in benny dino foxy kiro; do
            echo "=== build $CHARACTER ==="
            rive "rive/$CHARACTER" --once --format=json | tee "rive/$CHARACTER/build/build.json"
            rive inspect "rive/$CHARACTER" --json > "rive/$CHARACTER/build/inspect.json"
            cp "rive/$CHARACTER/build/$CHARACTER.riv" "public/rive/$CHARACTER.riv"
          done

      - name: Keep committed runtime assets in sync
        if: github.event_name == 'push'
        shell: bash
        run: |
          CHANGES="$(git status --porcelain -- public/rive/benny.riv public/rive/dino.riv public/rive/foxy.riv public/rive/kiro.riv)"
          if [ -z "$CHANGES" ]; then
            echo "Committed Rive runtimes are already current."
            exit 0
          fi
          echo "$CHANGES"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/rive/benny.riv public/rive/dino.riv public/rive/foxy.riv public/rive/kiro.riv
          git commit -m "build(rive): sync character library runtimes"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Typecheck and build app
        run: npm run build

      - name: Install Playwright Chromium
        run: |
          npm install --no-save --no-audit --no-fund playwright@latest
          npx playwright install --with-deps chromium

      - name: Start app preview
        shell: bash
        run: |
          npx vite preview --host 127.0.0.1 --port 4173 > /tmp/pixilive-rive-preview.log 2>&1 &
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4173 > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/pixilive-rive-preview.log || true
          exit 1

      - name: Capture library browser smoke states
        env:
          PIXILIVE_PREVIEW_URL: http://127.0.0.1:4173
        run: node scripts/capture-rive-kiro.mjs

      - name: Capture Foxy visual QA matrix
        env:
          PIXILIVE_PREVIEW_URL: http://127.0.0.1:4173
        run: node scripts/capture-foxy-quality.mjs

      - name: Render CLI previews
        shell: bash
        run: |
          set -euo pipefail
          for CHARACTER in benny dino foxy kiro; do
            rive "rive/$CHARACTER" --screenshot="rive/$CHARACTER/build/$CHARACTER-cli.png" --advance=2s
          done
          rive "rive/foxy" --screenshot="visual-artifacts/foxy-v2/foxy-cli-neutral.png" --advance=2s

      - name: Capture schemas for next rig iterations
        shell: bash
        run: |
          {
            for TYPE in Artboard LayoutComponentStyle Shape Triangle Ellipse Rectangle Fill SolidColor Node RootBone Bone IKConstraint TranslationConstraint RotationConstraint TransformConstraint ViewModel ViewModelPropertyNumber ViewModelPropertyBoolean ViewModelPropertyEnum ViewModelPropertyTrigger Enum; do
              echo "=== $TYPE ==="
              rive schema "$TYPE" || true
              echo
            done
          } > rive/kiro/build/schema-notes.txt

      - name: Upload Rive library artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rive-character-library-build
          path: |
            rive/benny/build/
            rive/dino/build/
            rive/foxy/build/
            rive/kiro/build/
            visual-artifacts/**/*.png
          if-no-files-found: warn
