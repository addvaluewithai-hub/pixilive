name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Typecheck, build, and visual check
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package.json

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build
        run: npm run build

      - name: Install Playwright Chromium
        run: |
          npm install --no-save --no-audit --no-fund playwright@latest
          npx playwright install --with-deps chromium

      - name: Start app and visual harness servers
        run: |
          npx vite preview --host 127.0.0.1 --port 4173 > /tmp/pixilive-preview.log 2>&1 &
          npx vite --host 127.0.0.1 --port 4174 > /tmp/pixilive-harness.log 2>&1 &

          for port in 4173 4174; do
            ready=0
            for attempt in {1..30}; do
              if curl --fail --silent http://127.0.0.1:$port > /dev/null; then
                ready=1
                break
              fi
              sleep 1
            done

            if [ "$ready" -ne 1 ]; then
              echo "Server on port $port did not become ready"
              cat /tmp/pixilive-preview.log || true
              cat /tmp/pixilive-harness.log || true
              exit 1
            fi
          done

      - name: Capture characters, faces, visemes, and static performance
        env:
          PIXILIVE_PREVIEW_URL: http://127.0.0.1:4173
          PIXILIVE_VISUAL_HARNESS_URL: http://127.0.0.1:4174
        run: node scripts/capture-characters.mjs

      - name: Validate and capture full motion paths
        env:
          PIXILIVE_VISUAL_HARNESS_URL: http://127.0.0.1:4174
        run: node scripts/capture-motion-paths.mjs

      - name: Upload visual artifacts
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: character-screenshots-${{ github.sha }}
          path: visual-artifacts/*.png
          if-no-files-found: warn
          retention-days: 14
