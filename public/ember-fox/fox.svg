<svg id="fox-stage" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 580" role="img" aria-labelledby="fox-title fox-desc">
 <title id="fox-title">Ember, a little orange fox</title>
 <desc id="fox-desc">A softly shaded orange fox with fluffy ivory cheeks, large amber eyes, a teal scarf and a full white-tipped tail.</desc>
